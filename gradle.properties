org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
kotlin.code.style=official

# The Mihon app already ships kotlin-stdlib; don't duplicate it in the APK.
kotlin.stdlib.default.dependency=false

# Sandboxed build hosts may not allow the Kotlin compile daemon to create
# its marker files under %LOCALAPPDATA%; compile in-process instead.
kotlin.compiler.execution.strategy=in-process
